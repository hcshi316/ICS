[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "input-conditioned-search"
version = "0.1.0"
description = "Input-Conditioned Search: test-time scaling of recursive reasoners through their inputs"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/Apache-2.0.txt", "LICENSES/MIT-PPBench.txt",
                 "ics_baselines/*/LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "einops>=0.8", "pyyaml>=6", "safetensors>=0.4", "huggingface_hub>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ppbench = ["ppbench==0.1.0"]  # rebuilding the Light-Up and PPB datasets (also needs Node.js)

[tool.setuptools.packages.find]
include = ["ics", "ics.*", "ics_baselines", "ics_baselines.*"]

[tool.setuptools.package-data]
ics = ["configs/eval/*.yaml", "configs/train/*.yaml"]
ics_baselines = ["*/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the built datasets under $ICS_DATA_ROOT"]

[tool.ruff]
line-length = 120
src = [".", "tests"]
extend-exclude = ["ics/trm/layers.py"]

[tool.ruff.lint]
extend-select = ["E501"]
